services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      # Debug access from this machine only; the frontend reaches it via the
      # compose network, so this mapping could be removed entirely.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Must listen on all interfaces *inside* the container; the loopback-only
      # port mapping above is what keeps it private on the host.
      HOST: 0.0.0.0
    volumes:
      - ./one_line_day_py/src/data/journal_entries.db:/app/one_line_day_py/src/data/journal_entries.db
      # Uploaded photos/PDFs. Create the host directory first (see README), or
      # Docker creates it owned by root. If you set ATTACHMENTS_PATH, point the
      # container side of this mount at the same path.
      - ./one_line_day_py/src/data/attachments:/app/one_line_day_py/src/data/attachments

  frontend:
    build:
      context: ./frontend
      args:
        # Relative: nginx in the frontend container proxies /api/ to the backend
        VITE_API_BASE_URL: /api
    ports:
      # Reachable from the local network; the backend is not (see README)
      - "3000:80"
    depends_on:
      - backend
