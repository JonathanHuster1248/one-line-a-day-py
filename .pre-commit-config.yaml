default_install_hook_types: [pre-push, pre-merge-commit]
default_stages: [pre-push]

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.1
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    - id: pytest
      name: pytest (backend)
      entry: .venv/bin/pytest
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-merge-commit]
    - id: vitest
      name: vitest (frontend)
      entry: npm --prefix frontend run test
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-merge-commit]
