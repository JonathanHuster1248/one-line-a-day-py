<!DOCTYPE html>

<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>One Line a Day</title>
    <style>
        .date-selector {
            padding: 0.75rem 1.25rem;
            background-color: #eaf3ea;
            border: 2px solid #228B22;
            border-radius: 999px;
            margin: 0;
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-selector label {
            font-weight: bold;
            color: #2e5e3a;
        }

        .date-selector input {
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
            color: #2e5e3a;
            background-color: #fdfbf6;
            border: 1px solid #228B22;
            border-radius: 999px;
        }

        .date-selector input:focus {
            outline: none;
            border-color: #2e5e3a;
            box-shadow: 0 0 5px rgba(34, 139, 34, 0.5);
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="module" src="/src/main.tsx"></script>

</body>
</html>
