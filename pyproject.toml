[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "one-line-day-py"
version = "0.4.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "litestar>=2.18.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sniffio>=1.3.1",
    "sqlmodel>=0.0.31",
    "uuid>=1.30",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "nox>=2025.5.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
